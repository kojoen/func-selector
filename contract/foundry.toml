[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = false
gas_reports = ["*"]

[profile.default.invariant]
runs = 256
depth = 15
call_override = false

[profile.default.fuzz]
runs = 256
seed = "0xdeadbeef"

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
